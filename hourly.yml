name: hourly-news
on:
  schedule:
    - cron: "5 * * * *"   # every hour at minute 5
  workflow_dispatch: {}    # lets you run it manually from the Actions tab
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests beautifulsoup4
      - run: python fetch_news.py
      - name: Commit updated news.json
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Update news $(date -u +%FT%TZ)"
          git push
