<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>US Entertainment Trends Desk</title>
<style>
:root{--bg:#f4f3ef;--card:#fff;--text:#1b1b1f;--muted:#6b6b75;--line:#e4e2dc;--accent:#d6336c;--accent2:#5b4bdb;--fresh:#12b76a}
@media (prefers-color-scheme:dark){:root{--bg:#121215;--card:#1b1b20;--text:#f0eff2;--muted:#9a9aa6;--line:#2b2b33;--accent:#f06595;--accent2:#8f84ff;--fresh:#32d583}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 24px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:20px;flex:1;letter-spacing:-.3px}h1 span{color:var(--accent)}
.stat{font-size:12px;color:var(--muted)}
button{font:inherit;cursor:pointer}
.btn{padding:8px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:600}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.chip{padding:4px 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:13px}
.chip.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
.chip.cat.on{background:var(--accent);border-color:var(--accent)}
.sep{color:var(--muted)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:22px;padding:18px 24px;max-width:1500px;margin:auto}
@media(max-width:980px){.wrap{grid-template-columns:1fr}aside{order:-1}}
h2{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
.count{font-size:12px;font-weight:500;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;color:inherit;text-decoration:none;transition:.15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .im{width:100%;aspect-ratio:16/10;object-fit:cover;background:var(--line);display:block}
.card .bd{padding:10px 12px 12px}
.card h3{margin:6px 0 4px;font-size:14px;line-height:1.35}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--line);font-size:11px;color:var(--muted)}
.meta{font-size:12px;color:var(--muted)}
.hot{color:var(--accent);font-weight:700;font-size:12px}
aside .box{position:sticky;top:96px;max-height:calc(100vh - 116px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--fresh);box-shadow:0 0 0 0 var(--fresh);animation:p 1.8s infinite}
@keyframes p{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.fs{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.fs:last-child{border-bottom:0}.fs:hover h3{color:var(--accent)}
.fs img,.fs .ph{flex:0 0 78px;height:78px;border-radius:8px;object-fit:cover;background:var(--line)}
.fs h3{margin:0 0 3px;font-size:13.5px;line-height:1.35}
.ago{color:var(--fresh);font-weight:700}
.empty{padding:18px;color:var(--muted);text-align:center;border:1px dashed var(--line);border-radius:12px}
</style></head><body>
<header>
  <div class="top">
    <h1>US Entertainment <span>Trends Desk</span></h1>
    <span class="stat" id="stat">Loading…</span>
    <button class="btn" id="refresh">⟳ Refresh</button>
  </div>
  <div class="row" id="filters"></div>
</header>
<div class="wrap">
  <main>
    <h2>Last 24 hours <span class="count" id="n24"></span></h2>
    <div class="grid" id="grid"></div>
  </main>
  <aside>
    <div class="box">
      <h2><span class="dot"></span>Just published <span class="count" id="nfresh"></span></h2>
      <div id="fresh"></div>
    </div>
  </aside>
</div>
<script>
var FRESH_HOURS=3;
var DATA=null,src="All",cat="All",onlyTrend=false;
function $(i){return document.getElementById(i)}
function ago(iso){var m=Math.max(0,Math.round((Date.now()-new Date(iso))/60000));
  if(m<60)return m+" min ago";var h=Math.floor(m/60);return h+" h "+(m%60)+" min ago"}
function chip(label,cls,on,fn){var b=document.createElement("button");b.className="chip "+cls+(on?" on":"");b.textContent=label;b.onclick=fn;return b}
function img(url,cls){
  if(!url){var d=document.createElement("div");d.className=cls+" ph im";return d}
  var i=document.createElement("img");i.className=cls;i.loading="lazy";i.referrerPolicy="no-referrer";i.src=url;
  i.onerror=function(){i.style.visibility="hidden"};return i}
function load(){
  $("stat").textContent="Loading…";
  fetch("news.json?t="+Date.now()).then(function(r){return r.json()}).then(function(d){DATA=d;render()})
  .catch(function(){$("stat").textContent="Could not load news.json"})}
function pass(i){return(src==="All"||i.source===src)&&(cat==="All"||i.category===cat)&&(!onlyTrend||i.trending)}
function render(){
  var f=$("filters");f.textContent="";
  ["All"].concat(Object.keys(DATA.per_site)).forEach(function(s){f.appendChild(chip(s,"",s===src,function(){src=s;render()}))});
  var sp=document.createElement("span");sp.className="sep";sp.textContent="|";f.appendChild(sp);
  ["All","Celebrity","Music","Movies","TV","Streaming","Awards","Fashion"].forEach(function(c){f.appendChild(chip(c,"cat",c===cat,function(){cat=c;render()}))});
  f.appendChild(chip("🔥 Trending only","cat",onlyTrend,function(){onlyTrend=!onlyTrend;render()}));
  var all=DATA.items.filter(pass);
  var fresh=all.filter(function(i){return Date.now()-new Date(i.published)<=FRESH_HOURS*3600000})
    .sort(function(a,b){return new Date(b.published)-new Date(a.published)});
  $("stat").textContent="Updated "+ago(DATA.generated_at)+" · "+Object.entries(DATA.per_site).map(function(p){return p[0]+" "+p[1]}).join(" · ");
  $("n24").textContent="("+all.length+")";$("nfresh").textContent="last "+FRESH_HOURS+" h ("+fresh.length+")";
  var g=$("grid");g.textContent="";
  if(!all.length){g.className="";var e=document.createElement("div");e.className="empty";e.textContent="No stories match these filters.";g.appendChild(e)}
  else{g.className="grid";all.forEach(function(i){
    var a=document.createElement("a");a.className="card";a.href=i.url;a.target="_blank";a.rel="noopener noreferrer";
    a.appendChild(img(i.image,"im"));
    var b=document.createElement("div");b.className="bd";
    var t=document.createElement("span");t.className="tag";t.textContent=i.category;b.appendChild(t);
    var h=document.createElement("h3");h.textContent=i.title;b.appendChild(h);
    var m=document.createElement("div");m.className="meta";m.textContent=i.source+" · "+ago(i.published);b.appendChild(m);
    if(i.trending){var x=document.createElement("div");x.className="hot";x.textContent="🔥 Trending: "+i.trend_term;b.appendChild(x)}
    a.appendChild(b);g.appendChild(a)})}
  var fl=$("fresh");fl.textContent="";
  if(!fresh.length){var e2=document.createElement("div");e2.className="empty";e2.textContent="Nothing new in the last "+FRESH_HOURS+" hours.";fl.appendChild(e2)}
  fresh.forEach(function(i){
    var a=document.createElement("a");a.className="fs";a.href=i.url;a.target="_blank";a.rel="noopener noreferrer";
    a.appendChild(img(i.image,""));
    var d=document.createElement("div");
    var h=document.createElement("h3");h.textContent=i.title;d.appendChild(h);
    var m=document.createElement("div");m.className="meta";
    var s=document.createElement("span");s.className="ago";s.textContent=ago(i.published);
    m.appendChild(s);m.appendChild(document.createTextNode(" · "+i.source+" · "+i.category+(i.trending?" · 🔥":"")));
    d.appendChild(m);a.appendChild(d);fl.appendChild(a)})}
$("refresh").onclick=load;
load();setInterval(load,10*60*1000);
setInterval(function(){if(DATA)render()},60*1000);
</script></body></html>
