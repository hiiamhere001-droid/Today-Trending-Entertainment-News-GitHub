<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>US Entertainment Trends Desk</title>
<style>
:root{--bg:#f4f3ef;--card:#fff;--text:#1b1b1f;--muted:#6b6b75;--line:#e4e2dc;--accent:#d6336c;--accent2:#5b4bdb;--fresh:#12b76a}
@media (prefers-color-scheme:dark){:root{--bg:#121215;--card:#1b1b20;--text:#f0eff2;--muted:#9a9aa6;--line:#2b2b33;--accent:#f06595;--accent2:#8f84ff;--fresh:#32d583}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 24px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:20px;flex:1;letter-spacing:-.3px}h1 span{color:var(--accent)}
.stat{font-size:12px;color:var(--muted)}
button{font:inherit;cursor:pointer}
.btn{padding:8px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:600}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.chip{padding:4px 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:13px}
.chip.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
.chip.cat.on{background:var(--accent);border-color:var(--accent)}
.sep{color:var(--muted)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:22px;padding:18px 24px;max-width:1500px;margin:auto}
@media(max-width:980px){.wrap{grid-template-columns:1fr}aside{order:-1}}
h2{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
.count{font-size:12px;font-weight:500;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;color:inherit;text-decoration:none;transition:.15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .im{width:100%;aspect-ratio:16/10;object-fit:cover;background:var(--line);display:block}
.card .bd{padding:10px 12px 12px}
.card h3{margin:6px 0 4px;font-size:14px;line-height:1.35}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--line);font-size:11px;color:var(--muted)}
.meta{font-size:12px;color:var(--muted)}
.hot{color:var(--accent);font-weight:700;font-size:12px}
aside .box{position:sticky;top:96px;max-height:calc(100vh - 116px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--fresh);box-shadow:0 0 0 0 var(--fresh);animation:p 1.8s infinite}
@keyframes p{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.fs{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.fs:last-child{border-bottom:0}.fs:hover h3{color:var(--accent)}
.fs img,.fs .ph{flex:0 0 78px;height:78px;border-radius:8px;object-fit:cover;background:var(--line)}
.fs h3{margin:0 0 3px;font-size:13.5px;line-height:1.35}
.ago{color:var(--fresh);font-weight:700}
.empty{padding:18px;color:var(--muted);text-align:center;border:1px dashed var(--line);border-radius:12px}
.card{position:relative}
.tick{position:absolute;top:8px;right:8px;z-index:2;width:30px;height:30px;padding:0;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.55);color:transparent;font-size:16px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center}
.tick:hover,.tick:focus-visible{background:var(--fresh);border-color:var(--fresh);color:#fff}
.fs{position:relative;padding-right:34px}
.fs .tick{top:8px;right:0;width:26px;height:26px;font-size:14px;border-color:var(--muted);background:transparent}
.fs .tick:hover{border-color:var(--fresh);background:var(--fresh)}
.btn.ok{background:var(--accent2)}
.btn.ok b{background:#fff;color:var(--accent2);border-radius:99px;padding:0 7px;margin-left:4px;font-size:12px}
.panel{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;justify-content:flex-end}
.panel[hidden]{display:none}
.pbox{width:min(440px,100%);height:100%;overflow:auto;background:var(--card);border-left:1px solid var(--line);padding:16px}
.ph2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.ph2 h2{margin:0}
.ph2 .btn{background:var(--bg);color:var(--text);border:1px solid var(--line)}
.okrow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.okrow .fs{flex:1;border:0}
.total{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:99px;background:var(--accent);color:#fff;font-weight:700;font-size:14px}
.total small{font-weight:500;opacity:.9;font-size:12px}
.btn.lost{background:var(--card);color:var(--text);border:1px solid var(--accent)}
.btn.lost b{background:var(--accent);color:#fff;border-radius:99px;padding:0 7px;margin-left:4px;font-size:12px}
.undo{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:4px 10px;font-size:12px}
</style></head><body>
<header>
  <div class="top">
    <h1>US Entertainment <span>Trends Desk</span></h1>
    <span class="total" id="total">📰 …</span>
    <span class="stat" id="stat">Loading…</span>
    <button class="btn lost" id="lostbtn">🕘 Lost news 24 h <b id="lostn">0</b></button>
    <button class="btn ok" id="okbtn">✓ Ok work <b id="okn">0</b></button>
    <button class="btn" id="refresh">⟳ Refresh</button>
  </div>
  <div class="row" id="filters"></div>
</header>
<div class="wrap">
  <main>
    <h2>Last 24 hours <span class="count" id="n24"></span></h2>
    <div class="grid" id="grid"></div>
  </main>
  <aside>
    <div class="box">
      <h2><span class="dot"></span>Just published <span class="count" id="nfresh"></span></h2>
      <div id="fresh"></div>
    </div>
  </aside>
</div>
<div class="panel" id="lostpanel" hidden><div class="pbox">
  <div class="ph2"><h2>Lost news 24 h <span class="count">(published 24–48 hours ago)</span></h2><button class="btn" id="lostclose">Close</button></div>
  <div id="lostlist"></div>
</div></div>
<div class="panel" id="okpanel" hidden><div class="pbox">
  <div class="ph2"><h2>Ok work <span class="count">(read stories, kept for 48 hours)</span></h2><button class="btn" id="okclose">Close</button></div>
  <div id="oklist"></div>
</div></div>
<script>
var FRESH_HOURS=3;
var DATA=null,src="All",cat="All",onlyTrend=false;
function $(i){return document.getElementById(i)}
var DONE={},IDX={},STORE_OK=true,pressing=false;
function nu(u){try{var p=new URL(u);return "u:"+p.hostname.replace(/^www\./,"").toLowerCase()+p.pathname.replace(/\/+$/,"").toLowerCase()}catch(e){return "u:"+String(u||"").toLowerCase()}}
function nt(t){var s=String(t||"").toLowerCase().replace(/[^a-z0-9]+/g,"");return s.length>15?"t:"+s:""}
function readDone(){try{var s=localStorage.getItem("okwork");return s?(JSON.parse(s)||{}):{}}catch(e){STORE_OK=false;return DONE}}
function writeDone(){try{localStorage.setItem("okwork",JSON.stringify(DONE))}catch(e){STORE_OK=false}}
function reindex(){IDX={};for(var k in DONE){var it=DONE[k].item||{};IDX[k]=1;IDX[nu(it.url)]=1;var t=nt(it.title);if(t)IDX[t]=1}}
function isDone(i){return !!(IDX[nu(i.url)]||IDX[i.url]||(nt(i.title)&&IDX[nt(i.title)]))}
function isFresh(i){return Date.now()-new Date(i.published)<=FRESH_HOURS*3600000}
function prune(){DONE=readDone();var ch=false;for(var k in DONE){var p=new Date((DONE[k].item||{}).published);if(!isNaN(p)&&Date.now()-p>1728e5){delete DONE[k];ch=true}}if(ch)writeDone();reindex()}
function markDone(i){DONE=readDone();DONE[nu(i.url)]={t:Date.now(),item:i};writeDone();reindex();render()}
function undo(u){DONE=readDone();delete DONE[u];writeDone();reindex();render()}
function tickBtn(i){var b=document.createElement("button");b.className="tick";b.textContent="✓";b.title="Mark as read";b.setAttribute("aria-label","Mark as read");
  b.onclick=function(e){e.preventDefault();e.stopPropagation();markDone(i)};return b}
function renderOk(){
  var keys=Object.keys(DONE).sort(function(a,b){return DONE[b].t-DONE[a].t});
  $("okn").textContent=keys.length;
  var box=$("oklist");box.textContent="";
  if(!keys.length){var e=document.createElement("div");e.className="empty";e.textContent="No read stories yet. Tick a story to move it here.";box.appendChild(e);return}
  keys.forEach(function(k){var i=DONE[k].item;
    var row=document.createElement("div");row.className="okrow";
    var a=document.createElement("a");a.className="fs";a.href=i.url;a.target="_blank";a.rel="noopener noreferrer";
    a.appendChild(img(i.image,""));
    var d=document.createElement("div");var h=document.createElement("h3");h.textContent=i.title;d.appendChild(h);
    var m=document.createElement("div");m.className="meta";m.textContent=i.source+" · "+ago(i.published);d.appendChild(m);
    a.appendChild(d);row.appendChild(a);
    var u=document.createElement("button");u.className="undo";u.textContent="Undo";u.onclick=function(){undo(k)};row.appendChild(u);
    box.appendChild(row)})}
function renderLost(list){
  $("lostn").textContent=list.length;
  var box=$("lostlist");box.textContent="";
  if(!list.length){var e=document.createElement("div");e.className="empty";e.textContent="No stories from 24–48 hours ago.";box.appendChild(e);return}
  list.forEach(function(i){
    var a=document.createElement("a");a.className="fs";a.href=i.url;a.target="_blank";a.rel="noopener noreferrer";
    a.appendChild(img(i.image,""));a.appendChild(tickBtn(i));
    var d=document.createElement("div");var h=document.createElement("h3");h.textContent=i.title;d.appendChild(h);
    var m=document.createElement("div");m.className="meta";m.textContent=i.source+" · "+i.category+" · "+ago(i.published)+(i.trending?" · 🔥":"");d.appendChild(m);
    a.appendChild(d);box.appendChild(a)})}
function ago(iso){var m=Math.max(0,Math.round((Date.now()-new Date(iso))/60000));
  if(m<60)return m+" min ago";var h=Math.floor(m/60);return h+" h "+(m%60)+" min ago"}
function chip(label,cls,on,fn){var b=document.createElement("button");b.className="chip "+cls+(on?" on":"");b.textContent=label;b.onclick=fn;return b}
function img(url,cls){
  if(!url){var d=document.createElement("div");d.className=cls+" ph im";return d}
  var i=document.createElement("img");i.className=cls;i.loading="lazy";i.referrerPolicy="no-referrer";i.src=url;
  i.onerror=function(){i.style.visibility="hidden"};return i}
function load(){
  $("stat").textContent="Loading…";
  fetch("news.json?t="+Date.now()).then(function(r){return r.json()}).then(function(d){DATA=d;if(!pressing)render()})
  .catch(function(){$("stat").textContent="Could not load news.json"})}
function pass(i){return !isDone(i)&&(src==="All"||i.source===src)&&(cat==="All"||i.category===cat)&&(!onlyTrend||i.trending)}
function render(){
  var f=$("filters");f.textContent="";
  ["All"].concat(Object.keys(DATA.per_site)).forEach(function(s){f.appendChild(chip(s,"",s===src,function(){src=s;render()}))});
  var sp=document.createElement("span");sp.className="sep";sp.textContent="|";f.appendChild(sp);
  ["All","Celebrity","Music","Movies","TV","Streaming","Awards","Fashion"].forEach(function(c){f.appendChild(chip(c,"cat",c===cat,function(){cat=c;render()}))});
  f.appendChild(chip("🔥 Trending only","cat",onlyTrend,function(){onlyTrend=!onlyTrend;render()}));
  prune();
  var vis=DATA.items.filter(pass);
  var H=3600000,age=function(i){return Date.now()-new Date(i.published)};
  var recent=vis.filter(function(i){return age(i)<=24*H});
  var old=vis.filter(function(i){return age(i)>24*H&&age(i)<=48*H})
    .sort(function(a,b){return new Date(b.published)-new Date(a.published)});
  var all=recent.filter(function(i){return !isFresh(i)});
  var fresh=recent.filter(isFresh)
    .sort(function(a,b){return new Date(b.published)-new Date(a.published)});
  var t24=DATA.items.filter(function(i){return age(i)<=24*H}).length,t3=DATA.items.filter(isFresh).length;
  $("total").innerHTML="📰 "+t24+" stories <small>last 24 h · "+t3+" new in "+FRESH_HOURS+" h</small>";
  renderLost(old);
  $("stat").textContent=(STORE_OK?"":"⚠ Browser storage blocked: read marks will not be saved · ")+"Updated "+ago(DATA.generated_at)+" · "+Object.entries(DATA.per_site).map(function(p){return p[0]+" "+p[1]}).join(" · ");
  $("n24").textContent="("+all.length+")";$("nfresh").textContent="last "+FRESH_HOURS+" h ("+fresh.length+")";
  var g=$("grid");g.textContent="";
  if(!all.length){g.className="";var e=document.createElement("div");e.className="empty";e.textContent="No stories match these filters.";g.appendChild(e)}
  else{g.className="grid";all.forEach(function(i){
    var a=document.createElement("a");a.className="card";a.href=i.url;a.target="_blank";a.rel="noopener noreferrer";
    a.appendChild(img(i.image,"im"));a.appendChild(tickBtn(i));
    var b=document.createElement("div");b.className="bd";
    var t=document.createElement("span");t.className="tag";t.textContent=i.category;b.appendChild(t);
    var h=document.createElement("h3");h.textContent=i.title;b.appendChild(h);
    var m=document.createElement("div");m.className="meta";m.textContent=i.source+" · "+ago(i.published);b.appendChild(m);
    if(i.trending){var x=document.createElement("div");x.className="hot";x.textContent="🔥 Trending: "+i.trend_term;b.appendChild(x)}
    a.appendChild(b);g.appendChild(a)})}
  var fl=$("fresh");fl.textContent="";
  if(!fresh.length){var e2=document.createElement("div");e2.className="empty";e2.textContent="Nothing new in the last "+FRESH_HOURS+" hours.";fl.appendChild(e2)}
  fresh.forEach(function(i){
    var a=document.createElement("a");a.className="fs";a.href=i.url;a.target="_blank";a.rel="noopener noreferrer";
    a.appendChild(img(i.image,""));a.appendChild(tickBtn(i));
    var d=document.createElement("div");
    var h=document.createElement("h3");h.textContent=i.title;d.appendChild(h);
    var m=document.createElement("div");m.className="meta";
    var s=document.createElement("span");s.className="ago";s.textContent=ago(i.published);
    m.appendChild(s);m.appendChild(document.createTextNode(" · "+i.source+" · "+i.category+(i.trending?" · 🔥":"")));
    d.appendChild(m);a.appendChild(d);fl.appendChild(a)});
  renderOk()}
$("refresh").onclick=load;
$("okbtn").onclick=function(){$("okpanel").hidden=false};
$("lostbtn").onclick=function(){$("lostpanel").hidden=false};
$("lostclose").onclick=function(){$("lostpanel").hidden=true};
$("lostpanel").onclick=function(e){if(e.target===this)this.hidden=true};
$("okclose").onclick=function(){$("okpanel").hidden=true};
$("okpanel").onclick=function(e){if(e.target===this)this.hidden=true};
document.addEventListener("keydown",function(e){if(e.key==="Escape"){$("okpanel").hidden=true;$("lostpanel").hidden=true}});
DONE=readDone();reindex();
function safeRender(){if(DATA&&!pressing)render()}
document.addEventListener("pointerdown",function(e){if(e.target.closest&&e.target.closest(".tick"))pressing=true},true);
["pointerup","pointercancel","click"].forEach(function(ev){document.addEventListener(ev,function(){setTimeout(function(){pressing=false},0)},true)});
window.addEventListener("storage",function(e){if(e.key==="okwork")safeRender()});
renderOk();
load();setInterval(load,10*60*1000);
setInterval(safeRender,60*1000);
</script></body></html>
