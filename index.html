<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>US Entertainment Trends Desk</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--text:#1b1b1f;--muted:#6b6b75;--line:#e4e2dc;--accent:#d6336c}
@media (prefers-color-scheme:dark){:root{--bg:#141417;--card:#1d1d22;--text:#f0eff2;--muted:#9a9aa6;--line:#2c2c33;--accent:#f06595}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}
header{padding:16px 24px;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{margin:0;font-size:20px;flex:1}button{padding:9px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.bar{padding:10px 24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-size:13px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.wrap{display:grid;grid-template-columns:1fr 400px;gap:20px;padding:12px 24px;max-width:1300px;margin:auto}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.story{display:flex;gap:12px;padding:10px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none}
.story:hover{border-color:var(--accent)}.story img,.ph{flex:0 0 96px;height:96px;object-fit:cover;border-radius:8px;background:var(--line)}
.story h3{margin:0 0 4px;font-size:14px}.meta{font-size:12px;color:var(--muted)}
.fire{color:var(--accent);font-weight:700}.muted{color:var(--muted);font-size:13px}
</style></head><body>
<header><h1>US Entertainment Trends Desk</h1><button id="refresh">⟳ Refresh</button></header>
<div class="bar" id="bar"></div>
<div class="wrap">
 <div class="card"><div id="info" class="muted">Loading…</div><div id="sites" class="muted" style="margin-top:8px"></div></div>
 <aside><div id="list"></div></aside>
</div>
<script>
var DATA=null,src="All",cat="All",onlyTrend=false;
function $(i){return document.getElementById(i)}
function chip(label,on,fn){var b=document.createElement("button");b.className="chip"+(on?" on":"");b.textContent=label;b.onclick=fn;return b}
async function load(){
  $("info").textContent="Loading…";
  try{var r=await fetch("news.json?t="+Date.now());DATA=await r.json()}catch(e){$("info").textContent="Could not load news.json. Run fetch_news.py first.";return}
  render()}
function render(){
  var bar=$("bar");bar.textContent="";
  var srcs=["All"].concat(Object.keys(DATA.per_site)),cats=["All","Celebrity","Music","Movies","TV","Streaming","Awards","Fashion"];
  srcs.forEach(function(s){bar.appendChild(chip(s,s===src,function(){src=s;render()}))});
  bar.appendChild(document.createTextNode(" | "));
  cats.forEach(function(c){bar.appendChild(chip(c,c===cat,function(){cat=c;render()}))});
  bar.appendChild(chip("🔥 Trending only",onlyTrend,function(){onlyTrend=!onlyTrend;render()}));
  var items=DATA.items.filter(function(i){return(src==="All"||i.source===src)&&(cat==="All"||i.category===cat)&&(!onlyTrend||i.trending)});
  $("info").textContent="US date "+DATA.date_us+" · collected "+new Date(DATA.generated_at).toLocaleString()+" · "+items.length+" stories";
  $("sites").textContent="Stories today per site: "+Object.entries(DATA.per_site).map(function(p){return p[0]+" "+p[1]}).join(" · ");
  var l=$("list");l.textContent="";
  if(!items.length){l.textContent="No stories match.";return}
  items.forEach(function(i){
    var a=document.createElement("a");a.className="story";a.href=i.url;a.target="_blank";a.rel="noopener noreferrer";
    var im;if(i.image){im=document.createElement("img");im.src=i.image;im.loading="lazy";im.referrerPolicy="no-referrer"}else{im=document.createElement("div");im.className="ph"}
    var d=document.createElement("div"),h=document.createElement("h3");h.textContent=i.title;
    var m=document.createElement("div");m.className="meta";
    m.textContent=i.category+" · "+i.source+" · "+new Date(i.published).toLocaleTimeString();
    d.appendChild(h);d.appendChild(m);
    if(i.trending){var f=document.createElement("div");f.className="fire";f.textContent="🔥 Trending: "+i.trend_term;d.appendChild(f)}
    a.appendChild(im);a.appendChild(d);l.appendChild(a)})}
$("refresh").onclick=load;load();setInterval(load,10*60*1000);
</script></body></html>
